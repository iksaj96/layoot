<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Layoot</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center;
             background:#0a0a0a; color:#fafafa; font-family:system-ui,sans-serif; text-align:center; }
      button { margin-top:16px; padding:10px 20px; border:0; border-radius:8px;
               background:#7c3aed; color:#fff; font-size:16px; cursor:pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Kamu sedang offline</h1>
      <p>Sambungkan ke internet lalu coba lagi.</p>
      <button onclick="location.reload()">Muat ulang</button>
    </main>
  </body>
</html>
